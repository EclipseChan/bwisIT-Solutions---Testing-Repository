spring.application.name=canteen

# Credentials come from environment variables, never hard-code them
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:grpxx_canteendb}
spring.datasource.username=${DB_USER:canteen_admin}
spring.datasource.password=${DB_PASSWORD}

# Tables already exist: Hibernate only checks that entities match, never alters the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120